# Weekly pull requests that update dependencies (section 17). Each one runs the full CI.
version: 2
updates:
  # Every package.json in the pnpm workspace, through the root pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only proposes versions at least a week old, so a hijacked release is usually caught and
    # pulled before it reaches us.
    cooldown:
      default-days: 7
    # The first group that matches wins. Packages that must share a version move together, even
    # across major versions; everything else gets one PR for all its minor and patch updates.
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      next:
        patterns: ['next', 'eslint-config-next']
      minor-and-patch:
        update-types: [minor, patch]

  # The actions in .github/workflows, including the ones pinned to a commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
