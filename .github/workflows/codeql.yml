name: CodeQL

# Static analysis for security bugs (section 17): the TypeScript code, and these workflows
# themselves. Findings show up under Security → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 03:00 UTC: new CodeQL queries run even in a week without pushes.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      # Neither language needs a build: CodeQL reads the source directly.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
