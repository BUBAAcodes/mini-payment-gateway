name: CI

# Every pull request runs every check. A push to main runs them again on the merged code, then
# publishes the images and migrates the production database (section 17). Render deploys once
# all of this commit's checks have passed ("After CI Checks Pass"); Vercel deploys from Git.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a branch cancels its older, now-pointless run. Never on main: there it could
# stop a migration halfway, so a newer run waits for the running one instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json. Third-party actions are
      # pinned to a commit, because a tag can be moved; Dependabot keeps the pins current.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Fails if pnpm-lock.yaml is out of date. postinstall generates the Prisma client.
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit and integration tests. Testcontainers starts Postgres and Redis in the runner's Docker.
      - run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium and the system libraries it needs.
      - run: pnpm --filter @gateway/e2e exec playwright install --with-deps chromium

      # global-setup.ts builds the API, web and demo store images, starts the whole stack in
      # Docker from an empty database, then migrates and seeds it. E2E_KEEP_STACK leaves the stack
      # up afterwards, so a failure's container logs can still be read below.
      - run: pnpm test:e2e
        env:
          E2E_KEEP_STACK: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      # Plain docker rather than compose: compose would demand the secrets global-setup generated.
      - name: Container logs
        if: failure()
        run: |
          for id in $(docker ps -aq --filter label=com.docker.compose.project=gateway-e2e); do
            echo "::group::$(docker inspect --format '{{.Name}}' "$id")"
            docker logs --tail 200 "$id" 2>&1
            echo "::endgroup::"
          done

  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, demo-store]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layers go to GitHub's cache, one scope per app, so `publish` rebuilds from it in seconds.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          tags: gateway-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Fails on high and critical vulnerabilities that have a fix. Ones without a fix are left
      # out: they would keep CI red with nothing to do about them.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gateway-${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish image (${{ matrix.app }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, demo-store]
    steps:
      - uses: actions/checkout@v7

      # Image names must be lowercase, and the repo owner isn't.
      - name: Image name
        id: image
        env:
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gateway-$APP" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build the images job scanned, from its cache. The source label links the package
      # to this repo on GitHub.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}

  # Render's free tier has no pre-deploy step, so migrations run here. Render waits for this check
  # too, so the new code never starts against an old schema. Migrations must stay backward
  # compatible: the old version keeps serving traffic until the new one is live.
  migrate:
    name: Migrate production database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Neon's direct (non-pooled) URL: Prisma holds a lock for the whole migration, which the
      # pooled URL can't keep. Until the secret exists, the job passes without doing anything.
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - name: Skip without a database
        if: env.DIRECT_DATABASE_URL == ''
        run: echo "::notice::Skipped. Add the DIRECT_DATABASE_URL repository secret (Neon's direct URL) to migrate production."

      - uses: actions/checkout@v7
        if: env.DIRECT_DATABASE_URL != ''
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.DIRECT_DATABASE_URL != ''
      - uses: actions/setup-node@v7
        if: env.DIRECT_DATABASE_URL != ''
        with:
          node-version: 24
          cache: pnpm
      # Only the db package and what it depends on; prisma.config.ts reads DIRECT_DATABASE_URL.
      - run: pnpm install --frozen-lockfile --filter "@gateway/db..."
        if: env.DIRECT_DATABASE_URL != ''
      - run: pnpm --filter @gateway/db migrate:deploy
        if: env.DIRECT_DATABASE_URL != ''
