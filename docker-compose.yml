services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gateway -d gateway']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      LOG_LEVEL: info
      # Read from the root .env; Compose refuses to start the API without it.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:?set INTERNAL_CRON_SECRET in .env}
      SETTLEMENT_DELAY_DAYS: ${SETTLEMENT_DELAY_DAYS:-0}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      # Webhooks go to the demo-store service, a private Docker address. Never true when deployed.
      ALLOW_PRIVATE_WEBHOOK_URLS: 'true'
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Checkout page (and later the dashboard). Its server code calls the API by service name; the
  # browser only ever talks to web on localhost:3000.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

  # The pretend merchant. Its secrets come from `pnpm db:seed` (copied into .env). They default to
  # empty rather than using :? so `docker compose up postgres` works before you have seeded; the
  # store itself refuses to start without them and says why.
  demo-store:
    build:
      context: .
      dockerfile: apps/demo-store/Dockerfile
    environment:
      API_BASE_URL: http://api:4000
      # What the customer's browser sees, so checkout can send them back here.
      STORE_BASE_URL: http://localhost:3001
      GATEWAY_SECRET_KEY: ${GATEWAY_SECRET_KEY:-}
      GATEWAY_WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:-}
      GATEWAY_CHECKOUT_SECRET: ${GATEWAY_CHECKOUT_SECRET:-}
      LOG_LEVEL: info
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy

  # Only needed if email verification or password resets get added: docker compose --profile mail up
  mailpit:
    image: axllent/mailpit
    profiles: [mail]
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  pgdata:
